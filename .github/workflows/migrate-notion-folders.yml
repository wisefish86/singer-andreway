name: Migrate Anytype import directories
on:
  push:
    paths:
      - .github/workflows/migrate-notion-folders.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Create ordered folders and archive the verified ZIP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          from ftplib import FTP
          import os
          ftp=FTP("andreway.ru",timeout=60)
          ftp.login("andreway",os.environ["FTP_PASSWORD"])
          base="/www/andreway.ru/notion-import"
          ftp.cwd(base)
          def exists(path):
              try: ftp.cwd(path); return True
              except: return False
          def ensure(name):
              if not exists(base+"/"+name):
                  ftp.cwd(base); ftp.mkd(name)
              ftp.cwd(base)
          for name in ("01_Inbox","02_Done","03_Failed"):
              ensure(name)
          # The only known verified import is the prior five-image Notion test.
          legacy=base+"/incoming"
          if exists(legacy):
              entries=[p.rstrip("/").split("/")[-1] for p in ftp.nlst(legacy)]
              zipfiles=[n for n in entries if n.lower().endswith(".zip")]
              if len(zipfiles)==1:
                  filename=zipfiles[0]
                  dst=base+"/02_Done/"+filename
                  if dst.rstrip("/").split("/")[-1] in [p.rstrip("/").split("/")[-1] for p in ftp.nlst(base+"/02_Done")]:
                      raise ValueError("Destination ZIP already exists; refusing to overwrite")
                  ftp.rename(legacy+"/"+filename,dst)
                  print("Moved verified ZIP to 02_Done:",filename)
              elif len(zipfiles)>1:
                  raise ValueError("More than one legacy ZIP; refusing to select unverified archives: "+str(len(zipfiles)))
              else:
                  print("No legacy ZIP to move")
          # Do not delete archives or original folders. We deliberately avoid deleting
          # staging assets until the full-archive import is implemented and verified.
          for name in ("01_Inbox","02_Done","03_Failed"):
              ftp.cwd(base+"/"+name)
              print("Verified:",name)
          ftp.quit()
          PY
