name: Deploy singer voting function
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/singer-vote/**'
      - '.github/workflows/deploy-singer-vote.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: singer-vote-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Deploy only singer-vote
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy singer-vote --project-ref jjaunlbglskpddslwegp --no-verify-jwt
