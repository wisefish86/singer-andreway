name: Publish media gallery web app once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-media-webapp.yml'
      - 'apps-script/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singer-apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy-media-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1
      - name: Configure existing script and credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          test -n "$CLASP_CREDENTIALS" || { echo 'Missing CLASP_CREDENTIALS'; exit 1; }
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          cat > apps-script/.clasp.json <<'EOF'
          {"scriptId":"1jMJjCKIclP_1Bk7TR3hmYd1jrNJMLAYGOMZTJzuNe-Gxe0csFOzpCVjN","rootDir":"."}
          EOF
      - name: Push media endpoint and deploy web app
        working-directory: apps-script
        run: |
          clasp push --force
          clasp deploy -i AKfycbzCtHUBRaC3c_Tovx6We58tVElMRn1w6FUkcLCdNZAVhDyLnVj8hut-_gKTXgov086tlg --description "ANDREY-SPOET public media gallery"
