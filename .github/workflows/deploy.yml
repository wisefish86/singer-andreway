name: Build and deploy Astro site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: singer-andreway-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Verify favicons on every generated page
        run: node .github/scripts/verify-favicons.mjs

      - name: Test phone mask and compiled repertoire form
        run: node .github/scripts/verify-phone-mask.mjs

      - name: Test notification fallback and messenger links
        run: node .github/scripts/verify-request-share.mjs
      
      - name: Test cached repertoire and progressive preview markup
        run: node .github/scripts/verify-repertoire-cache.mjs

      - name: Verify desktop social QR links and MAX profile format
        run: node .github/scripts/verify-social-qr.mjs

      - name: Verify booking and guest messenger message contexts
        run: node .github/scripts/verify-contact-intents.mjs

      - name: Validate Apps Script syntax
        run: node --check apps-script/Code.js

      - name: Verify finale voting and reviews
        run: node .github/scripts/verify-voting.mjs

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: andreway.ru
          username: andreway
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /www/singer.andreway.ru/
          exclude: |
            **/images/**
            **/photos/**
            **/videos/**
            **/audio/plus/**
            **/reviews/uploads/**
            **/data/reviews.json
            **/data/media.json

      # The main FTP sync excludes user-uploaded media directories.
      # Create the root media folders independently; never synchronize/delete their contents.
      - name: Ensure media directories exist on FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for folder in photos videos reviews/uploads; do
            curl --fail --show-error --silent \
              --retry 2 \
              --user "andreway:${FTP_PASSWORD}" \
              --ftp-create-dirs \
              --upload-file "public/${folder}/.gitkeep" \
              "ftp://andreway.ru//www/singer.andreway.ru/${folder}/.gitkeep"
          done
