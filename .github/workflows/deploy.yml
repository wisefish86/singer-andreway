name: Build and deploy Astro site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: singer-andreway-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Verify favicons on every generated page
        run: node .github/scripts/verify-favicons.mjs

      - name: Test phone mask and compiled repertoire form
        run: node .github/scripts/verify-phone-mask.mjs

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: andreway.ru
          username: andreway
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /www/singer.andreway.ru/
          exclude: |
            **/images/**
            **/audio/plus/**
