name: Refresh public afisha and gallery cache

on:
  schedule:
    # Frequent enough for changes made in Calendar or Sheets, without visitor-side waits.
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-public-content.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: singer-public-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install thumbnail optimizer
        run: python -m pip install pillow==11.3.0
      - name: Refresh public calendar and media snapshots
        run: node .github/scripts/update-public-caches.mjs
      - name: Generate WebP preview thumbnails from FTP-hosted public originals
        run: python .github/scripts/update-thumbnails.py
      - name: Commit changed snapshots and preview images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/afisha.public.json public/media-catalog.json public/thumbs/
          if git diff --cached --quiet; then
            echo "Cached public data unchanged."
            exit 0
          fi
          git commit -m "Refresh prebuilt afisha and gallery cache"
          # Other site edits may arrive while thumbnails are generated.
          # Replay only the public snapshot commit on current main before pushing.
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
          # A push made with GITHUB_TOKEN does not trigger the normal push workflow.
          # Explicitly run the static site deployment after updating snapshots.
          GH_TOKEN="${{ github.token }}" gh workflow run deploy.yml --ref main
