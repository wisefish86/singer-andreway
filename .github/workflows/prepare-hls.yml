name: Automatically prepare adaptive HLS videos

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-hls.yml'
      - '.github/scripts/auto-hls.py'

concurrency:
  group: singer-video-hls
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Refresh HLS for all new or changed published videos
        env:
          FTP_HOST: andreway.ru
          FTP_USER: andreway
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/auto-hls.py
