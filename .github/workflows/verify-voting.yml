name: Verify finale voting proposal
on:
  pull_request:
    paths:
      - 'src/pages/vote/**'
      - 'src/pages/reviews/**'
      - 'src/data/reviews.ts'
      - 'public/reviews/**'
      - 'src/pages/index.astro'
      - 'supabase/functions/singer-vote/**'
      - 'supabase/migrations/*singer_finale_voting.sql'
      - 'supabase/migrations/*singer_vote_service_role_grants.sql'
      - '.github/scripts/verify-voting.mjs'
      - '.github/workflows/verify-voting.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - run: node .github/scripts/verify-voting.mjs
      - run: node .github/scripts/probe-live-voting.mjs
      - run: node .github/scripts/verify-contact-intents.mjs
