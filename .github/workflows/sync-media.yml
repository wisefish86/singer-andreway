name: Publish cached media from Google Sheets

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-media.yml'

concurrency:
  group: singer-public-media
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish public media snapshot atomically
        env:
          MEDIA_API_URL: https://script.google.com/macros/s/AKfycbzCtHUBRaC3c_Tovx6We58tVElMRn1w6FUkcLCdNZAVhDyLnVj8hut-_gKTXgov086tlg/exec?kind=media
          FTP_HOST: andreway.ru
          FTP_USER: andreway
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/sync-media.py
