name: Import Anytype V2 ZIPs into Notion
on:
  push:
    paths:
      - .github/workflows/import-anytype-v2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anytype-notion-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import notes, verify blocks and archive successful ZIPs
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: python scripts/import_anytype_v2.py
