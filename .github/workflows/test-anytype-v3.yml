name: Test Anytype V3 Import into Notion
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-anytype-v3.yml
permissions:
  contents: read
concurrency:
  group: anytype-notion-import
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate importer syntax
        run: python -m py_compile scripts/anytype_v3_1.py
      - name: Install requests
        run: python -m pip install requests
      - name: Test import notion-test ZIP without moving source
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: python scripts/anytype_v3_1.py --test-ftp
